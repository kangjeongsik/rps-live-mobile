<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RPS LIVE · 토너먼트</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px 14px 70px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:5px 0}.tag{color:#fbbf24;font-size:12px}section{background:#172338;border:1px solid #29374e;border-radius:16px;padding:16px;margin:12px 0}h2{font-size:16px;margin:0 0 12px}.muted{color:#aab9cf;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #43516a}input{background:#0d1728;color:#fff;width:100%;margin:5px 0}button{background:#2563eb;color:white;border:0;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.42}.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.moves button{font-size:29px;background:#263b59;min-height:86px}.moves button.selected{background:#2563eb;outline:2px solid #93c5fd}.match{border:1px solid #40516c;border-radius:12px;padding:10px;margin:8px 0;font-size:14px}.match.mine{border-color:#fbbf24}.winner{color:#86efac}.chat{height:170px;overflow-y:auto;background:#0d1728;padding:10px;border-radius:10px;font-size:13px}.chat div{margin:4px 0}.hide{display:none!important}.notice{color:#fcd34d;font-size:15px}.pill{background:#253b56;padding:5px 9px;border-radius:30px;font-size:12px}.result{font-size:24px;color:#fbbf24;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid div{background:#24364f;padding:10px;border-radius:10px;text-align:center}a{color:#93c5fd}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}.side{position:sticky;top:10px}.name{padding:9px 10px;border-radius:8px;background:#24364f;margin:5px 0;display:flex;justify-content:space-between}.name.out{background:#111a29;color:#77869a;filter:grayscale(1)}.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}.board h3{font-size:14px;margin:0 0 8px}.countdown{text-align:center;font-size:clamp(25px,6vw,42px);font-weight:1000;color:#fbbf24;text-shadow:0 0 25px #d9770670}.cinema{border-radius:14px;min-height:145px;background:radial-gradient(ellipse at center,#334563,#0d1628 75%);display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;margin:12px 0}.hand{font-size:clamp(48px,10vw,76px);filter:drop-shadow(0 6px 5px #0008)}.hand.left{animation:punchL .55s ease-in-out 2}.hand.right{animation:punchR .55s ease-in-out 2}.versus{font-size:20px;font-weight:900;color:#fbbf24}.burst{position:absolute;font-size:48px;animation:pop .7s ease-out}.stage{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px}.stageCol{min-width:145px;flex:1}.stageCol h3{font-size:13px;color:#fbbf24}.stageMatch{padding:8px;border:1px solid #42516a;border-radius:9px;margin:6px 0;font-size:12px}.stageMatch .win{color:#86efac;font-weight:bold}.cinema{animation:arenaFlash .5s ease-out}.cinema .hand{animation-duration:1s;animation-iteration-count:3}.cinema .burst{animation:pop .9s ease-out 2}@keyframes arenaFlash{0%{filter:brightness(2)}100%{filter:brightness(1)}}@keyframes punchL{50%{transform:translateX(30px) rotate(-15deg)}}@keyframes punchR{50%{transform:translateX(-30px) rotate(15deg)}}@keyframes pop{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.5);opacity:1}100%{transform:scale(1);opacity:0}}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static}.board{grid-template-columns:1fr 1fr}.wrap{padding:12px 10px 55px}section{padding:13px}}
.rosterTabs{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.rosterTabs button{flex:1;min-width:75px;padding:9px 5px;font-size:12px;background:#233550;color:#cbd5e1;border:1px solid #3c4f6b;border-radius:8px}.rosterTabs button.active{background:#1d4ed8;color:white;border-color:#60a5fa}.rosterEmpty{color:#94a3b8;font-size:13px;padding:12px 0}.stageCol{min-width:145px}.stageMatch{background:#152238}.stageMatch .out{color:#64748b;text-decoration:line-through}#confirmedBracket{margin-top:12px}</style></head><body><main class="wrap"><header><div><div class="tag">● LIVE TOURNAMENT v0.7.4</div><h1>✊ 가위바위보 토너먼트</h1></div><span id="status" class="pill">접속 중</span></header><div class="layout"><div><section><div id="notice" class="notice">연결 중...</div><p class="muted" id="stats"></p></section><section id="joinPanel"><h2>대회 참가 신청</h2><input id="nickname" placeholder="닉네임 (2~12자)" maxlength="12"><div id="codeArea" class="hide"><input id="code" placeholder="개인 인증코드"></div><label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:12px 0"><input id="agree" type="checkbox" style="width:auto;margin-top:3px"> <span>무료 시연 대회 참가에 동의합니다. 채팅에서 개인정보를 공유하지 않으며, 운영자가 대회를 초기화하면 참가 기록이 삭제될 수 있음을 확인했습니다.</span></label><button id="joinBtn" style="width:100%">동의하고 참가하기</button><p class="muted">동일한 기기에서는 참가 상태가 유지됩니다.</p></section><section id="myPanel" class="hide"><h2>내 참가 정보</h2><div class="row"><b id="myName"></b><span id="myState" class="pill"></span></div><p id="myMatch" class="muted"></p><div id="movePanel" class="hide"><p class="countdown" id="timer"></p><div class="moves"><button data-move="rock">✊<br><small>바위</small></button><button data-move="paper">✋<br><small>보</small></button><button data-move="scissors">✌️<br><small>가위</small></button></div><p class="muted">선택 시간 10초 · 이후 10초 동안 결과 공개를 기다립니다. 미선택 시 바위가 자동 적용됩니다.</p></div></section><section id="cinemaPanel" class="hide"><h2>⚔️ 대결 하이라이트</h2><div id="cinema" class="cinema"></div><div id="cinemaText" class="result" style="text-align:center"></div></section><section><h2>🎮 현재 경기 · 실시간 관전</h2><p class="muted" id="roundLabel">대진 추첨 대기</p><div id="matches"></div></div></section><section><h2>🏆 토너먼트 대진 현황</h2><p class="muted">확정된 경기 결과와 다음 대진을 확인하세요.</p><div id="confirmedBracket" class="stage"></div></section><section><h2>💬 실시간 채팅</h2><div id="chat" class="chat"></div><div class="row" style="margin-top:9px"><input id="chatInput" placeholder="메시지 (80자 이내)" maxlength="80" style="flex:1;min-width:0"><button id="chatBtn">전송</button></div></section><p class="muted">테스트 버전 · 서버 재시작 시 대회 데이터가 초기화됩니다.</p></div><aside class="side"><section><h2>👥 전체 참가 현황 <span id="headCount" class="pill">0명</span></h2><div class="rosterTabs"><button data-roster="all" class="active">전체 참가 <span id="allCount"></span></button><button data-roster="advance">진출자 <span id="advanceCount"></span></button><button data-roster="out">탈락자 <span id="outCount"></span></button></div><div id="roster"></div></section></aside></div></main><script>
let state=null,me=null,selected=null,lastCinema='',lastRound='',cinemaTimeout=0,rosterTab='all';const $=id=>document.getElementById(id),key='rps_tournament_token';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hands={rock:'✊',paper:'✋',scissors:'✌️'};
async function api(body,token=localStorage.getItem(key)){const r=await fetch('/tournament/api',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');return d}
async function resume(){if(!localStorage.getItem(key))return;try{me=await api({action:'resume'});render()}catch{localStorage.removeItem(key);me=null;render()}}
$('joinBtn').onclick=async()=>{if(!$('agree').checked){alert('참가 안내에 동의해주세요');return}try{const d=await api({action:'join',nickname:$('nickname').value,code:$('code').value,agree:$('agree').checked},null);localStorage.setItem(key,d.token);me=d;render()}catch(e){alert(e.message)}};
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=async()=>{try{await api({action:'move',move:b.dataset.move});selected=b.dataset.move;render()}catch(e){alert(e.message)}});
$('chatBtn').onclick=async()=>{try{await api({action:'chat',message:$('chatInput').value});$('chatInput').value=''}catch(e){alert(e.message)}};$('chatInput').onkeydown=e=>{if(e.key==='Enter')$('chatBtn').click()};
function cinema(m){if(!m?.b)return;const id=m.id+':'+m.phase+':'+m.amove+':'+m.bmove;if(id===lastCinema)return;lastCinema=id;const a=hands[m.amove]||'✊',b=hands[m.bmove]||'✊';$('cinemaPanel').classList.remove('hide');$('cinema').innerHTML=`<span class="hand left">${a}</span><span class="versus">VS</span><span class="hand right">${b}</span><span class="burst">💥</span>`;$('cinemaText').textContent=`${m.a?.name||'-'} ${a} VS ${b} ${m.b?.name||'-'} · 🏆 승자 ${m.winner===m.a?.id?m.a?.name:m.b?.name}`;clearTimeout(cinemaTimeout);cinemaTimeout=setTimeout(()=>$('cinemaPanel').classList.add('hide'),6500)}
function render(){if(!state)return;const s=state;const players=s.players||[];$('status').textContent=s.phase==='playing'?'🔴 경기 중':s.phase==='finished'?'🏆 종료':'대기';$('notice').textContent=s.notice;$('stats').textContent=`참가 ${s.participants}명 · 생존 ${s.alive}명 · 닉네임 시연 모드`;$('headCount').textContent=s.participants+'명';$('allCount').textContent=players.length;$('advanceCount').textContent=players.filter(p=>p.alive).length;$('outCount').textContent=players.filter(p=>!p.alive).length;const rosterPlayers=players.filter(p=>rosterTab==='all'||(rosterTab==='advance'?p.alive:!p.alive));$('roster').innerHTML=rosterPlayers.map(p=>`<div class="name ${p.alive?'':'out'}"><b>${esc(p.name)}</b><span>${p.alive?(s.phase==='lobby'?'참가':'진출'):'탈락'}</span></div>`).join('')||'<p class="rosterEmpty">해당 참가자가 없습니다.</p>';document.querySelectorAll('[data-roster]').forEach(b=>b.classList.toggle('active',b.dataset.roster===rosterTab));
$('joinPanel').classList.toggle('hide',!!me||s.phase!=='lobby');$('codeArea').classList.toggle('hide',s.mode!=='verified');const mine=s.matches.find(m=>m.a?.id===me?.id||m.b?.id===me?.id);if(me){$('myPanel').classList.remove('hide');$('myName').textContent=me.name;const minePlayer=players.find(p=>p.id===me.id);$('myState').textContent=s.champion?.id===me.id?'🏆 우승':minePlayer&&!minePlayer.alive?'관전 중':'참가 중';$('myMatch').textContent=mine?`상대: ${(mine.a?.id===me.id?mine.b?.name:mine.a?.name)||'부전승'} · ${mine.phase==='active'?'경기 중':mine.phase==='done'?'경기 종료':'대기 중'}`:'현재 경기는 없습니다 · 관전할 수 있습니다';const auto=mine?.phase==='active'&&((mine.a?.id===me.id&&mine.autoA)||(mine.b?.id===me.id&&mine.autoB));if(auto)selected='rock';const can=mine?.phase==='active'&&s.phase==='playing'&&Date.now()<s.deadline-10000;$('movePanel').classList.toggle('hide',mine?.phase!=='active');document.querySelectorAll('[data-move]').forEach(b=>{b.disabled=!can;b.classList.toggle('selected',selected===b.dataset.move)})}
$('roundLabel').textContent=s.round?`${s.round}라운드 · ${s.roundType} · ${s.matches.length}개 대진`:'대진 추첨 대기';$('matches').innerHTML=s.matches.length?s.matches.map((m,i)=>`<div class="match ${m.a?.id===me?.id||m.b?.id===me?.id?'mine':''}"><div class="row" style="justify-content:space-between"><b>경기 ${i+1}</b><span class="pill">${m.phase==='done'?'종료':m.phase==='active'?'🔴 LIVE':'대기'}</span></div><div class="grid" style="margin-top:8px"><div>${esc(m.a?.name||'-')} ${m.phase==='active'?(m.submittedA?'✓':'…'):''}</div><div>${esc(m.b?.name||'부전승')} ${m.phase==='active'?(m.submittedB?'✓':'…'):''}</div></div>${m.phase==='done'?`<p class="winner">승자: ${esc((m.winner===m.a?.id?m.a:m.b)?.name||m.a?.name)}</p>`:''}${m.phase==='done'&&m.b?`<p class="muted">${hands[m.amove]||'미선택'} vs ${hands[m.bmove]||'미선택'}</p>`:''}</div>`).join(''):'<p class="muted">대회가 시작되면 대진표가 표시됩니다.</p>';

const bracketStages=[...(s.history||[]),...(s.matches?.length?[{round:s.round,matches:s.matches}]:[])];$('confirmedBracket').innerHTML=bracketStages.length?bracketStages.map(x=>`<div class="stageCol"><h3>${x.matches.length===1?'결승':x.matches.length===2?'4강':x.matches.length===4?'8강':x.round+'라운드'}</h3>${x.matches.map(m=>`<div class="stageMatch"><div class="${m.phase==='done'&&m.winner!==m.a?.id?'out':''} ${m.winner===m.a?.id?'win':''}">${esc(m.a?.name||'-')}</div><div class="${m.phase==='done'&&m.winner!==m.b?.id?'out':''} ${m.winner===m.b?.id?'win':''}">${esc(m.b?.name||'부전승')}</div><div class="muted">${m.phase==='done'?'✓ 결과 확정':m.phase==='active'?'🔴 진행 중':'대기'}</div></div>`).join('')}</div>`).join(''):'<p class="muted">대진 추첨 후 표시됩니다.</p>';
$('chatBtn').disabled=!me||!s.chatEnabled;const box=$('chat'),nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<50;box.innerHTML=s.chat.map(x=>`<div><b>${esc(x.name)}:</b> ${esc(x.message)}</div>`).join('');if(nearBottom)box.scrollTop=box.scrollHeight;
if(s.phase!=='playing')selected=null;const recent=(s.history||[]).flatMap(x=>x.matches).concat(s.matches).filter(m=>m.phase==='done'&&m.b&&m.amove&&m.bmove).at(-1);if(recent)cinema(recent);
}
function tick(){if(!state)return;const s=state,n=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));const mine=s.matches.find(m=>m.phase==='active'&&(m.a?.id===me?.id||m.b?.id===me?.id));const auto=mine&&((mine.a?.id===me?.id&&mine.autoA)||(mine.b?.id===me?.id&&mine.autoB));$('timer').textContent=n>10?`✊ 선택까지 ${n-10}초`:n>0?`🎬 잠시 후 대결 결과가 공개됩니다 · ${n}초`:s.phase==='playing'?'🎬 결과 공개 중':'🏁 경기 종료';document.querySelectorAll('[data-move]').forEach(b=>{if(n<=10)b.disabled=true})}document.querySelectorAll('[data-roster]').forEach(b=>b.addEventListener('click',()=>{rosterTab=b.dataset.roster;render()}));setInterval(tick,200);const es=new EventSource('/tournament/events');es.onmessage=e=>{const old=state;state=JSON.parse(e.data);if(old?.round!==state.round||old?.phase!==state.phase)selected=null;render()};es.onerror=()=>{$('status').textContent='재연결 중'};resume();
</script></body></html>
