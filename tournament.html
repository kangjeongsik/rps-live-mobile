<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RPS LIVE · 토너먼트</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:640px;margin:auto;padding:16px 14px 70px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:6px 0}.tag{color:#fbbf24;font-size:12px}section{background:#172338;border:1px solid #29374e;border-radius:16px;padding:16px;margin:12px 0}h2{font-size:16px;margin:0 0 12px}.muted{color:#9fb0c9;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #43516a}input{background:#0d1728;color:#fff;width:100%;margin:5px 0}button{background:#2563eb;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.moves button{font-size:27px;background:#263b59}.moves button.selected{background:#2563eb;outline:2px solid #93c5fd}.match{border:1px solid #40516c;border-radius:12px;padding:10px;margin:8px 0;font-size:14px}.match.mine{border-color:#fbbf24}.winner{color:#86efac}.chat{height:160px;overflow-y:auto;background:#0d1728;padding:10px;border-radius:10px;font-size:13px}.chat div{margin:4px 0}.hide{display:none!important}.notice{color:#fcd34d;font-size:14px}.pill{background:#253b56;padding:5px 9px;border-radius:30px;font-size:12px}.result{font-size:20px;color:#fbbf24;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid div{background:#24364f;padding:10px;border-radius:10px;text-align:center}a{color:#93c5fd}</style></head><body><main class="wrap"><header><div><div class="tag">● LIVE TOURNAMENT v0.7.0</div><h1>✊ 가위바위보 토너먼트</h1></div><span id="status" class="pill">접속 중</span></header><section><div id="notice" class="notice">연결 중...</div><p class="muted" id="stats"></p></section><section id="joinPanel"><h2 id="joinTitle">대회 참가</h2><div id="verifiedFields" class="hide"><input id="code" placeholder="개인 인증코드" autocomplete="off"><input id="nickname" placeholder="닉네임 (2~12자)" maxlength="12"></div><button id="joinBtn" style="width:100%">참가하기</button><p class="muted">한 번 참가하면 이 휴대폰에서 참가 정보가 유지됩니다.</p></section><section id="myPanel" class="hide"><h2>내 참가 정보</h2><div class="row"><b id="myName"></b><span id="myState" class="pill"></span></div><p id="myMatch" class="muted"></p><div id="movePanel" class="hide"><p class="notice" id="timer"></p><div class="moves"><button data-move="rock">✊<br><small>바위</small></button><button data-move="paper">✋<br><small>보</small></button><button data-move="scissors">✌️<br><small>가위</small></button></div><p class="muted">남은 10초부터 선택을 변경할 수 없습니다.</p></div></section><section><h2>🏆 대진표 · 실시간 관전</h2><p class="muted" id="roundLabel">참가 신청 중</p><div id="matches"></div></section><section><h2>💬 실시간 채팅</h2><div id="chat" class="chat"></div><div class="row" style="margin-top:9px"><input id="chatInput" placeholder="메시지 (80자 이내)" maxlength="80" style="flex:1;width:50%"><button id="chatBtn">전송</button></div></section><p class="muted">테스트 버전 · 서버 재시작 시 대회 데이터가 초기화됩니다.</p></main><script>
let state=null,me=null,selected=null;const $=id=>document.getElementById(id),key='rps_tournament_token';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(body,token=localStorage.getItem(key)){const r=await fetch('/tournament/api',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'요청 실패');return data}async function resume(){const token=localStorage.getItem(key);if(!token)return;try{me=await api({action:'resume'});render()}catch{localStorage.removeItem(key);me=null;render()}}
$('joinBtn').onclick=async()=>{try{const d=await api({action:'join',code:$('code').value,nickname:$('nickname').value},null);localStorage.setItem(key,d.token);me=d;render()}catch(e){alert(e.message)}};document.querySelectorAll('[data-move]').forEach(b=>b.onclick=async()=>{try{await api({action:'move',move:b.dataset.move});selected=b.dataset.move;render()}catch(e){alert(e.message)}});$('chatBtn').onclick=async()=>{try{await api({action:'chat',message:$('chatInput').value});$('chatInput').value=''}catch(e){alert(e.message)}};$('chatInput').onkeydown=e=>{if(e.key==='Enter')$('chatBtn').click()};function render(){if(!state)return;const s=state;$('status').textContent=s.phase==='playing'?'🔴 경기 중':s.phase==='finished'?'종료':'대기';$('notice').textContent=s.notice;$('stats').textContent=`참가 ${s.participants}명 · 생존 ${s.alive}명 · ${s.mode==='verified'?'인증 닉네임':'익명'} 모드`;$('joinPanel').classList.toggle('hide',!!me||s.phase!=='lobby');$('verifiedFields').classList.toggle('hide',s.mode!=='verified');$('joinTitle').textContent=s.mode==='verified'?'인증코드 참가':'익명 참가';$('myPanel').classList.toggle('hide',!me);const mine=s.matches.find(m=>m.a?.id===me?.id||m.b?.id===me?.id);if(me){$('myName').textContent=me.name;$('myState').textContent=s.champion?.id===me.id?'🏆 우승':s.phase==='finished'?'대회 종료':s.matches.some(m=>m.winner===me.id)||mine?.phase!=='done'?'참가 중':'관전 중';$('myMatch').textContent=mine?`상대: ${(mine.a?.id===me.id?mine.b?.name:mine.a?.name)||'부전승'} · ${mine.phase==='active'?'경기 중':mine.phase==='done'?'경기 종료':'대기 중'}`:'현재 경기는 없습니다 · 관전할 수 있습니다';const can=mine?.phase==='active'&&s.phase==='playing'&&Date.now()<s.deadline-10000;$('movePanel').classList.toggle('hide',mine?.phase!=='active');document.querySelectorAll('[data-move]').forEach(b=>{b.disabled=!can;b.classList.toggle('selected',selected===b.dataset.move)})}$('roundLabel').textContent=s.round?`${s.round}라운드 · ${s.roundType} · ${s.matches.length}개 대진`:'대진 추첨 대기';$('matches').innerHTML=s.matches.length?s.matches.map((m,i)=>`<div class="match ${m.a?.id===me?.id||m.b?.id===me?.id?'mine':''}"><div class="row" style="justify-content:space-between"><b>경기 ${i+1}</b><span class="pill">${m.phase==='done'?'종료':m.phase==='active'?'🔴 LIVE':'대기'}</span></div><div class="grid" style="margin-top:8px"><div>${esc(m.a?.name||'-')} ${m.phase==='active'?(m.submittedA?'✓':'…'):''}</div><div>${esc(m.b?.name||'부전승')} ${m.phase==='active'?(m.submittedB?'✓':'…'):''}</div></div>${m.phase==='done'?`<p class="winner">승자: ${esc((m.winner===m.a?.id?m.a:m.b)?.name||m.a?.name)}</p>`:''}${m.phase==='done'&&m.b?`<p class="muted">${({rock:'✊',paper:'✋',scissors:'✌️'})[m.amove]||'미선택'} vs ${({rock:'✊',paper:'✋',scissors:'✌️'})[m.bmove]||'미선택'}</p>`:''}</div>`).join(''):'<p class="muted">대회가 시작되면 대진표가 표시됩니다.</p>';$('chatBtn').disabled=!me||!s.chatEnabled;const box=$('chat');const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<50;box.innerHTML=s.chat.map(x=>`<div><b>${esc(x.name)}:</b> ${esc(x.message)}</div>`).join('');if(nearBottom)box.scrollTop=box.scrollHeight;if(s.phase!=='playing')selected=null}function tick(){if(!state)return;const n=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));$('timer').textContent=`남은 시간 ${n}초${n<=10?' · 선택 잠금':''}`;document.querySelectorAll('[data-move]').forEach(b=>{if(n<=10)b.disabled=true})}setInterval(tick,200);const es=new EventSource('/tournament/events');es.onmessage=e=>{const old=state;state=JSON.parse(e.data);if(old?.round!==state.round||old?.phase!==state.phase)selected=null;render()};es.onerror=()=>{$('status').textContent='재연결 중'};resume();</script></body></html>
