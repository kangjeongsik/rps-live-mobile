<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인</title><style>body{background:#0b1220;color:#fff;font:16px system-ui;margin:0;display:grid;place-items:center;min-height:100vh}form{background:#172338;padding:26px;border-radius:16px;width:min(90vw,370px)}input,button{display:block;box-sizing:border-box;width:100%;margin:12px 0;padding:13px;border-radius:9px;font:inherit}input{background:#0c1525;color:white;border:1px solid #526079}button{border:0;background:#2563eb;color:white;font-weight:bold}</style><form method="post" id="f"><h2>🔐 관리자 로그인</h2><p>한 번 로그인하면 7일간 유지됩니다.</p><input id="user" placeholder="관리자 ID" value="admin" autocomplete="username"><input id="pass" placeholder="비밀번호" type="password" autocomplete="current-password"><button>로그인</button><p id="msg"></p></form><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:document.getElementById('user').value,password:document.getElementById('pass').value})});if(r.ok){
const next=new URLSearchParams(location.search).get('next');
let target='/tournament/admin';
if(next&&next.startsWith('/')&&!next.startsWith('//')){
  const local=new URL(next,location.origin);
  if(local.origin===location.origin&&['/admin','/tournament/admin','/admin/daily','/admin/campaigns','/admin/advertising','/admin/coupons'].includes(local.pathname))
    target=local.pathname+local.search;
}
location.assign(target);
}else document.getElementById('msg').textContent=r.status===429?'잠시 후 다시 시도하세요.':'로그인 정보를 확인하세요'}</script></html>
