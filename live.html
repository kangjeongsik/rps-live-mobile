<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE 챌린지 · v0.13.0</title>
<link rel="stylesheet" href="/live.css"><link rel="stylesheet" href="/campaign.css"><link rel="stylesheet" href="/coupons.css">
</head>
<body><main>
<header><h1>LIVE 챌린지</h1><span>v0.13.0</span></header>
<nav aria-label="게임"><a href="/tournament">토너먼트</a><a href="/">진행자 대결</a></nav>
<p id="feedback" role="status"></p>
<section class="hero"><h2>오늘의 DAILY</h2><div id="today"></div></section>
<section id="nextSection" hidden><h2>다음 DAILY</h2><div id="next"></div></section>
<section><h2>내가 참가 중인 이벤트</h2><ul id="mine"></ul></section>
<section><h2>내 기업 이벤트</h2><div id="myCampaigns" class="campaign-records"></div></section>
<section><h2>새로 참여할 수 있는 기업 이벤트</h2><div id="campaignList" class="campaign-records"></div></section>
<section><h2>진행 중인 미션</h2><div id="missionList" class="campaign-records"></div></section>
<section><h2>진행 중인 토너먼트</h2><ul id="events"></ul></section>
<section><h2>내 DAILY 기록</h2><p id="totals"></p><ul id="history"></ul></section>
<section id="wallet"><h2>할인쿠폰함</h2><div id="walletItems"></div><button type="button" id="walletRefresh" class="secondary">쿠폰 새로고침</button></section>
<section><h2>알림 설정</h2>
  <label><input id="dailyStart" type="checkbox" disabled> DAILY 시작 알림 받기</label>
  <p id="pushStatus"></p>
  <p>DAILY 회차별 알림은 각 예약에서 설정합니다.</p>
<label><input type="checkbox" id="campaignUpdates" disabled> 기업 이벤트 운영 알림 동의</label>
<label><input type="checkbox" id="campaignAdvertising" disabled> 광고성 알림 동의</label>
<p>기업 이벤트 동의 설정을 저장할 수 있으며, 현재 발송은 준비 중입니다.</p>
</section>
</main><script src="/campaign-ui.js" defer></script><script src="/live.js" defer></script><script src="/coupons.js" defer></script></body></html>
