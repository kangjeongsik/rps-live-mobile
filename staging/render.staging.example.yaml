# Template only. Confirm the staging repository, branch, unique service name and plan before import.
services:
  - type: web
    name: live-challenge-staging-v013
    branch: staging/v0.13.0
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: RPS_ENV
        value: staging
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STAGING_DB_HOST
        sync: false
      - key: STAGING_DB_NAME
        sync: false
      - key: STAGING_DB_ROLE
        sync: false
      - key: STAGING_DB_ID
        sync: false
      - key: ADMIN_USER
        value: staging-admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DAILY_SCHEDULER_TOKEN
        sync: false
      - key: DAILY_PUSH_DELIVERY
        value: disabled
      - key: STAGING_ALLOW_PUSH
        value: disabled
