<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우승 상품 수령</title><style>body{background:#0d1728;color:white;font-family:sans-serif;max-width:600px;margin:30px auto;padding:20px}button,select,textarea{padding:12px;margin:6px;border-radius:8px}textarea{width:90%;height:100px}section{background:#1e293b;padding:16px;border-radius:12px;margin:12px 0}</style><h1>🏆 우승 상품 보관함</h1><section id="result">우승 기록 확인 중...</section><section id="claim" hidden><select id="type"><option value="google">구글 기프트카드</option><option value="valorant">발로란트</option><option value="kakao">카카오</option><option value="oliveyoung">올리브영</option></select><button id="claimBtn">상품 수령</button></section><section><h2>관리자 문의</h2><select id="category"><option value="prize">상품 수령</option><option value="code">코드 사용 불가</option><option value="bug">게임 오류</option><option value="idea">개선 제안</option></select><textarea id="message" placeholder="문의 내용을 입력하세요"></textarea><button id="send">문의 접수</button><button id="history">문의 답변 확인</button><div id="answers"></div></section><script>const access=location.pathname.split('/').pop();const api=async b=>{const r=await fetch('/tournament/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error);return d};const result=document.getElementById('result'),claim=document.getElementById('claim');async function load(){try{const d=await api({action:'winnerAccess',access});result.replaceChildren();const title=document.createElement('h3');title.textContent=d.winner+' 우승 기록';result.append(title);if(d.award){const detail=document.createElement('p');detail.textContent=d.award.name+' / 일련번호: '+d.award.serial+' / PIN: '+d.award.pin;result.append(detail)}else{const msg=document.createElement('p');msg.textContent='아직 상품을 수령하지 않았습니다.';result.append(msg);claim.hidden=false}}catch(e){result.textContent=e.message}}document.getElementById('claimBtn').onclick=async()=>{try{await api({action:'winnerClaim',access,type:document.getElementById('type').value});claim.hidden=true;load()}catch(e){alert(e.message)}};document.getElementById('send').onclick=async()=>{try{await api({action:'inquiry',access,category:document.getElementById('category').value,message:document.getElementById('message').value});document.getElementById('message').value='';alert('문의 접수 완료')}catch(e){alert(e.message)}};document.getElementById('history').onclick=async()=>{try{const d=await api({action:'myInquiries',access});document.getElementById('answers').replaceChildren(...d.inquiries.map(x=>{const el=document.createElement('p');el.textContent=x.message+' / 답변: '+(x.reply||'대기 중');return el}))}catch(e){alert(e.message)}};load();</script></html>
