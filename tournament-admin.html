<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토너먼트 관리자</title><style>body{font:15px system-ui;background:#101827;color:white;max-width:760px;margin:auto;padding:20px}section{background:#1c2a40;padding:18px;border-radius:14px;margin:14px 0}button,input,select{padding:12px;margin:4px;border-radius:9px;border:0;font:inherit}button{background:#2563eb;color:white;cursor:pointer}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101827;padding:12px;border-radius:10px}a{color:#93c5fd}</style></head><body><h1>🏆 토너먼트 관리자 v0.7.2</h1><button id="logout" style="float:right;background:#475569">로그아웃</button><p><a href="/tournament" target="_blank">참가자 화면 열기</a></p><section><h3>현재 상태</h3><pre id="state">연결 중</pre></section><section><h3>새 대회 만들기</h3><select id="mode"><option value="nickname">닉네임 + 동의 참가 (시연용)</option><option value="anonymous">익명 랜덤 토너먼트</option><option value="verified">인증코드 닉네임 토너먼트</option></select><button id="reset">새 대회 초기화</button><p>초기화 시 참가자와 대진표가 모두 삭제됩니다.</p></section><section><h3>인증코드 발급</h3><input id="count" type="number" min="1" max="200" value="10"><button id="codes">코드 발급</button><pre id="output">발급된 코드는 이 화면에서 복사해 개별 전달하세요. 서버는 원문 코드를 다시 보여주지 않습니다.</pre></section><section><h3>경기 진행</h3><label>선택 시간(초) <input id="duration" type="number" min="15" max="120" value="20"></label><button id="setDuration">시간 설정</button><p><button id="start">대진 추첨 · 대회 시작</button><button id="open">경기 시작 / 다음 경기</button><button id="close">현재 경기 즉시 종료</button></p><p>예선~8강 동시 진행, 4강·결승 한 경기씩 순차 중계. 무승부는 자동 재대결입니다.</p></section><section><h3>채팅 관리</h3><button id="toggleChat">채팅 켜기/끄기</button><button id="clearChat">채팅 삭제</button></section><script>const $=id=>document.getElementById(id);$('logout').onclick=async()=>{await fetch('/admin/logout',{method:'POST'});location.href='/admin-login'};async function cmd(name,extra={}){try{const r=await fetch('/tournament/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin',cmd:name,...extra})});const d=await r.json();if(r.status===401){location.href='/admin-login?next=%2Ftournament%2Fadmin';return null}if(!r.ok)throw Error(d.error);return d}catch(e){alert(e.message);return null}}$('reset').onclick=()=>{if(confirm('현재 참가자와 모든 대진을 삭제하고 새 대회를 시작할까요?'))cmd('reset',{mode:$('mode').value})};$('codes').onclick=async()=>{const d=await cmd('codes',{count:Number($('count').value)});if(d)$('output').textContent=d.codes.join('\n')};$('start').onclick=()=>cmd('start');$('open').onclick=()=>cmd('open');$('close').onclick=()=>cmd('close');$('setDuration').onclick=()=>cmd('duration',{duration:Number($('duration').value)});$('toggleChat').onclick=()=>cmd('toggleChat');$('clearChat').onclick=()=>cmd('clearChat');const es=new EventSource('/tournament/events');es.onmessage=e=>{const s=JSON.parse(e.data);$('state').textContent=`모드: ${s.mode}\n상태: ${s.phase}\n참가자: ${s.participants}명 / 생존: ${s.alive}명\n라운드: ${s.round} (${s.roundType})\n경기: ${s.matches.filter(x=>x.phase==='done').length}/${s.matches.length} 완료\n${s.notice}\n우승: ${s.champion?.name||'-'}`};</script></body></html>
